<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <header style="width: 100%; height: 83px; background-color: aqua;">
        <div alt="conteudo" style="padding: 14px 24px; display: flex; justify-content: space-between;">
            <p>←</p>
            <h1>Envie sua carta</h1>
            <p>asd</p>
        </div>
    </header>

    <main style="background-color: blueviolet; height: 100vh;">
        <section style=" background-color: chartreuse; margin: 0px 100px 0px 100px; display: grid; justify-content: center; align-items: center; height: 100vh;">
            <article class="carta-background">
                <aside style="float: right; width: 250px;">
                    <div style="display: flex; margin-top: 20px;">
                        <img src="../../img/Selo-Carta.png" style="width: 100px; margin-left: 120px;">
                        <img src="../../img/Selo-Postal.png" style="position: absolute; width: 200px; margin: 20px 100px 10px 0px;">
                    <div>
                    </div>
                        
                    </div>
                    <div style="margin: 50px 0px 0px -100px;">
                        <img src="../../img/Foto-catnap.png" style="width: 300px; position: fixed;">
                    </div>
                </aside>
                <section>
                    <div style="padding: 15px 10px 10px 20px;">
                        <h1>Destinatário</h1>
                    </div>
                    <div style="display: grid; justify-content: center; align-items: center; height: 68vh; width: 100hv;">
                        <form action="#" method="POST" class="needs-validation" novalidate>
                            <label class="form-label">Nome: </label>
                                <input class="form-control" type="text" id="nome" name="nome" required>
                            <label class="form-label">CPF: </label>
                                <input class="form-control" type="number" id="cpf" name="cpf" maxlength="11" placeholder="000000000/00" required>
                            <label class="form-label">RG: </label>
                                <input class="form-control" type="number" id="rg" name="rg" maxlength="9" placeholder="00.000.000-0" required>
                            <label class="form-label">Data Nascimento: </label>
                                <input class="form-control" type="date" id="dt" name="dt" required>
                            <label class="form-label">CEP: </label>
                                <input class="form-control" type="text" id="cep" name="cep" maxlength="8" placeholder="00000000" required>
                            <label class="form-label">Endereço: </label>
                                <input class="form-control" type="text" id="endereco" name="endereco" readonly required>
                            <label class="form-label">Número: </label>
                                <input class="form-control" type="number" id="numero" name="numero" maxlength="6" placeholder="000000" required>
                            <label class="form-label">Complemento: </label>
                                <input class="form-control" type="text" id="complemento" name="complemento">
                            <label class="form-label">Bairro: </label>
                                <input class="form-control" type="text" id="bairro" name="bairro" readonly required>
                            <label class="form-label">Cidade: </label>
                                <input class="form-control" type="text" id="cidade" name="cidade" readonly required>
                            <label class="form-label">Estado: </label>
                                <input class="form-control" type="text" id="estado" name="estado" readonly required>
                            <label class="form-label">Telefone: </label>
                                <input class="form-control" type="number" id="tel" name="tel" required>
                            <label class="form-label">Email: </label>
                                <input class="form-control" type="email" id="email" name="email" required>
                            
                            <input type="submit" value="Cadastrar" class="btn btn-primary">
                            <input type="reset" value="Limpar" class="btn btn-warning">
                        </form>
                    </div>
                </section>
            </article>
        </section>
    </main>

    <footer>

    </footer>
    
</body>
</html>
